version: '3.8'

services:
  rss-feed:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - DATA_DIR=/app/data
      - PORT=8000
      - SECRET_KEY=${SECRET_KEY:-please-change-this-secret-key-in-production}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    restart: unless-stopped
