<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tsuru (鶴)</title>
    <style>
        body {
            font-family: "Courier New", Courier, monospace;
            line-height: 1.6;
            color: #000;
            background-color: #fff;
            padding: 40px;
            max-width: 900px;
            margin: 0 auto;
            font-size: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-top: 15vh;
        }

        .login-container {
            width: 100%;
            max-width: 500px;
        }

        h1 {
            font-size: 1.5em;
            font-weight: normal;
            margin-bottom: 30px;
        }

        h1::before {
            content: "# ";
        }

        .form-container {
            margin: 30px 0;
            font-size: 14px;
        }

        .form-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 15px;
        }

        .button-row {
            display: flex;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .button-row button {
            margin-right: 100px;
        }

        label::before {
            content: "[ ";
        }

        label::after {
            content: " ]";
        }

        label {
            white-space: nowrap;
            min-width: 120px;
        }

        input[type="text"],
        input[type="password"] {
            font-family: "Courier New", Courier, monospace;
            width: 250px;
            padding: 4px 8px;
            border: none;
            border-bottom: 1px solid #000;
            background-color: transparent;
            font-size: 14px;
            outline: none;
        }

        input[type="text"]::placeholder,
        input[type="password"]::placeholder {
            color: #999;
        }

        button {
            padding: 4px 12px;
            background-color: transparent;
            color: #000;
            border: none;
            font-family: "Courier New", Courier, monospace;
            font-size: 14px;
            cursor: pointer;
        }

        button::before {
            content: "[ ";
        }

        button::after {
            content: " ]";
        }

        button:hover {
            background-color: #000;
            color: #fff;
        }

        .error {
            margin-top: 30px;
            padding: 10px 0;
            border-left: 3px solid #000;
            padding-left: 15px;
            color: #000;
        }

        .error::before {
            content: "> ERROR: ";
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>Login</h1>
        
        <form action="{{ base_path }}/login" method="post" class="form-container">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <div class="form-row">
                <label>Username</label>
                <input type="text" name="username" placeholder="" required autofocus>
            </div>
            <div class="form-row">
                <label>Password</label>
                <input type="password" name="password" placeholder="" required>
            </div>
            <div class="button-row">
                <button type="submit">Login</button>
            </div>
        </form>

        {% if error %}
        <div class="error">
            {{ error }}
        </div>
        {% endif %}
    </div>
</body>
</html>
